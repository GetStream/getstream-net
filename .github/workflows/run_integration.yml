name: _run-integration

on:
  workflow_call:
    secrets:
      STREAM_API_KEY:
        required: false
      STREAM_API_SECRET:
        required: true

concurrency:
  # Repository-wide, on purpose. The contended resource is the Stream app, not the branch.
  # Not cancel-in-progress: a half-run leaves users and channels behind.
  group: run-integration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: 🧪 Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Integration tests
      env:
        STREAM_API_KEY: ${{ vars.STREAM_API_KEY || secrets.STREAM_API_KEY }}
        STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        CONFIGURATION: Release
      run: make test-integration
