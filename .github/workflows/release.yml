name: Release

on:
  push:
    branches:
      - master
      - '*.x'
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Existing tag to (re)publish to NuGet, e.g. v16.1.1. Leave empty for a normal release run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  # Reversible half: keep the Release PR current. Stands down only while a release is
  # already pending, because until that one is tagged there is no release commit to stop
  # the walk at and it would propose the same commits again in a second Release PR.
  release-pr:
    name: Release PR
    needs: detect
    # No status function of its own would mean an implicit success(), so one transient
    # gh api error inside detect would stop the reversible half too. Its own guard still
    # has to be repeated here, because detect is skipped on the dispatch path and this
    # job must skip with it.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || inputs.publish_tag == '') &&
      (github.ref_name == 'master' || endsWith(github.ref_name, '.x')) &&
      needs.detect.outputs.pending != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-release: true

  # The tag, the GitHub Release and the NuGet push are irreversible, so the suite has to
  # run before them, which means knowing a release is pending before the suite starts.
  # The tag lands on the merged Release PR's merge commit while the suite runs on this
  # workflow's own commit, so `ready` also requires those to be the same commit. They
  # are, on the path that matters: the push of that merge.
  detect:
    name: Detect pending release
    if: >-
      (github.event_name == 'push' || inputs.publish_tag == '') &&
      (github.ref_name == 'master' || endsWith(github.ref_name, '.x'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      pending: ${{ steps.find.outputs.pending }}
      ready: ${{ steps.find.outputs.ready }}
    steps:
      - name: Find a merged Release PR waiting to be tagged
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          pending=false
          ready=false

          # Query the label directly, and page: release-please applies the label when it
          # opens the Release PR, not when it merges, so every Release PR closed without
          # merging keeps it forever and holds a slot in this listing. One page would
          # eventually stop containing the genuinely pending release, which reads as
          # "nothing to release" and passes. merged_at comes back in the listing, so
          # filtering on it here keeps the per-PR lookups below to real candidates.
          nums="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues" \
            -X GET -f state=closed -f labels='autorelease: pending' -f per_page=100 \
            --jq '.[] | select(.pull_request.merged_at != null) | .number')"

          # The base branch is not in that listing, so each candidate still needs a
          # lookup: a hotfix branch can hold its own pending release, and taking the
          # newest label match would drop this branch's release until the other clears.
          num=""
          sha=""
          for n in $nums; do
            # Under `bash -e` an unguarded assignment from a non-2xx would abort the
            # step, which would fail detect and skip release-pr with it.
            if ! sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" \
              --jq 'select(.base.ref == env.BASE) | .merge_commit_sha // empty')"; then
              echo "::warning::Could not read PR #${n}; skipping it."
              sha=""
              continue
            fi
            if [ -n "$sha" ]; then
              num="$n"
              break
            fi
          done

          if [ -z "$sha" ]; then
            echo "No pending release on ${BASE}."
          elif [ "$sha" != "$HEAD_SHA" ]; then
            # Reached when an earlier release run failed after the Release PR merged.
            # Tagging $sha here would tag a tree this run never tested, and failing
            # would redden every later push, so stand down and say why.
            pending=true
            echo "::warning::Release PR #${num} is still pending at ${sha}, which is not this run's commit ${HEAD_SHA}. Re-run the workflow run for ${sha} to finish that release."
            {
              echo "### Release stuck"
              echo
              echo "Release PR #${num} merged at \`${sha}\` and was never tagged, so no Release PR will be opened or refreshed until it clears."
              echo
              echo "Re-run the \`Release\` run for \`${sha}\`. If that commit is genuinely broken, remove the \`autorelease: pending\` label from #${num} by hand and release forward."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            pending=true
            ready=true
            echo "Pending release #${num} will be tagged at ${sha}."
          fi

          {
            echo "pending=${pending}"
            echo "ready=${ready}"
          } >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit

  # Irreversible half.
  release:
    name: 🚀 Tag and release
    needs: [detect, tests]
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: true

  # Chained rather than triggered on the release event, because a GitHub Release created
  # with GITHUB_TOKEN starts no new workflow run. Also reachable on its own through
  # workflow_dispatch with publish_tag, which is the recovery path once GitHub has
  # retired the original run and "Re-run failed jobs" is gone.
  publish:
    name: 📦 Publish to NuGet
    needs: release
    if: >-
      !cancelled() &&
      (inputs.publish_tag != '' || needs.release.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Resolve tag
        id: target
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          tag="${PUBLISH_TAG:-$RELEASE_TAG}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}
          # dotnet pack runs project code, and nothing here writes to the repository,
          # so do not leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Create NuGet package
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet pack src/stream-feed-net.csproj --configuration Release --no-build --output ./packages
          ls -la ./packages/

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet/login did not return NUGET_API_KEY. Check the Trusted Publishing policy and secrets.NUGET_USER (nuget.org profile name, not email)."
            exit 1
          fi

          dotnet nuget remove source nuget.org || true
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org

          # Exact path, not a glob: with --skip-duplicate a glob that matches a
          # differently-versioned package, or nothing, exits 0 and publishes nothing.
          pkg="./packages/getstream-net.${{ steps.target.outputs.version }}.nupkg"
          if [ ! -f "$pkg" ]; then
            echo "::error::${pkg} was not produced. dotnet pack takes its version from <Version> in the checked-out csproj, so that tree does not match tag ${{ steps.target.outputs.tag }}."
            exit 1
          fi

          dotnet nuget push "$pkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --no-symbols \
            --timeout 300

      # release-please creates the GitHub Release without assets; every release before
      # this one carried the nupkg, so keep attaching it.
      - name: Attach the package to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.target.outputs.tag }}" \
            "./packages/getstream-net.${{ steps.target.outputs.version }}.nupkg" --clobber
