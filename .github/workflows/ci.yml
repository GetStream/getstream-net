name: .NET CI

# pull_request only. A push trigger alongside it ran the whole suite twice on the same
# SHA, and the duplicate live legs raced each other against the Stream app several SDK
# repos share. The trade is that a merge to master, and a direct push to it, now run
# nothing: release.yml runs this same workflow only when a release is pending, so the
# gate before a tag is covered but the routine post-merge signal is gone.
on:
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit
