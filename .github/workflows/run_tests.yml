name: _run-tests

on:
  workflow_call:
    secrets:
      STREAM_API_KEY:
        required: false
      STREAM_API_SECRET:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job below skips on a Release PR. release-please only bumps the version and rewrites
# the changelog, and every source commit in one already passed this suite on the PR it came
# from. The guard sits on each job rather than on the calling job in ci.yml, because a job
# skipped by `if:` reports success and satisfies a required status check, while a reusable
# workflow that is never called produces no check at all. It tests the author as well as the
# branch name: on its own, the name would let any PR, a fork's included, call its branch
# release-please--x and skip every required check, which branch protection counts as met.
jobs:
  build-and-test:
    if: >-
      ${{ !(github.event.pull_request.user.login == 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore

    - name: Verify formatting
      run: dotnet format --verify-no-changes
      
    - name: Build (Debug)
      run: dotnet build --no-restore --configuration Debug
      
    - name: Build (Release)
      run: dotnet build --no-restore --configuration Release
    
    - name: Verify API Credentials
      env:
        STREAM_API_KEY: ${{ vars.STREAM_API_KEY || secrets.STREAM_API_KEY }}
        STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
      run: |
        echo "🔍 Checking API credentials..."
        
        if [ -z "$STREAM_API_KEY" ]; then
          echo "❌ STREAM_API_KEY is missing or empty"
          echo "   Please check that the secret 'STREAM_API_KEY' is set in repository settings"
        else
          echo "✅ STREAM_API_KEY is available (${#STREAM_API_KEY} characters)"
        fi
        
        if [ -z "$STREAM_API_SECRET" ]; then
          echo "❌ STREAM_API_SECRET is missing or empty"
          echo "   Please check that the secret 'STREAM_API_SECRET' is set in repository settings"
        else
          echo "✅ STREAM_API_SECRET is available (${#STREAM_API_SECRET} characters)"
        fi
        
        if [ -n "$STREAM_API_KEY" ] && [ -n "$STREAM_API_SECRET" ]; then
          echo "✅ API credentials are available from repository secrets"
          echo "API Key length: ${#STREAM_API_KEY} characters"
          echo "API Secret length: ${#STREAM_API_SECRET} characters"
        else
          echo "❌ API credentials are missing"
          exit 1
        fi
    
    # Release, not Debug: this is the configuration the shipped package is packed from,
    # and the suite is live against a shared Stream app, so running it twice per job
    # doubles the async-task load for no extra coverage.
    - name: Run Tests
      env:
        STREAM_API_KEY: ${{ vars.STREAM_API_KEY || secrets.STREAM_API_KEY }}
        STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        CONFIGURATION: Release
      run: |
        echo "Running all tests with API credentials from repository secrets"
        make test
    
    - name: Check for warnings
      run: |
        echo "Checking for build warnings..."
        dotnet build --no-restore --configuration Release --verbosity normal 2>&1 | tee build.log
        if grep -q "warning" build.log; then
          echo "❌ Build warnings found:"
          grep "warning" build.log
          exit 1
        else
          echo "✅ No build warnings found"
        fi
    
    - name: Test NuGet package creation
      run: |
        echo "Testing NuGet package creation..."
        dotnet pack src/stream-feed-net.csproj --configuration Release --no-build --output ./test-packages
        ls -la ./test-packages/
        echo "✅ NuGet package created successfully" 