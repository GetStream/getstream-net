name: _run-tests

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The unit lane receives no credentials. Keep it that way: a fork PR gets no secrets and
# still goes green, and a live fixture added without [Category("Integration")] fails here
# instead of passing against a live Stream app.
jobs:
  build-and-test:
    name: 🧪 Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Verify formatting
      run: dotnet format --verify-no-changes

    - name: Build (Debug)
      run: dotnet build --no-restore --configuration Debug

    - name: Build (Release)
      run: dotnet build --no-restore --configuration Release

    - name: Unit tests
      env:
        CONFIGURATION: Release
      run: make test

    - name: Check for warnings
      run: |
        dotnet build --no-restore --configuration Release --verbosity normal 2>&1 | tee build.log
        if grep -q "warning" build.log; then
          echo "❌ Build warnings found:"
          grep "warning" build.log
          exit 1
        fi

    - name: Test NuGet package creation
      run: |
        dotnet pack src/stream-feed-net.csproj --configuration Release --no-build --output ./test-packages
        ls -la ./test-packages/
